name: update-archive

# Runs once a day. Pulls the latest links from the Google Sheet and drip-feeds
# up to 3 new verified sites per run (with previews). Auto-commits so the live
# site always shows fresh data — zero manual interference.
#
# Note: GitHub queues scheduled runs, so the actual start is often 1–3 h late.

on:
  schedule:
    - cron: "15 18 * * *" # daily at 11:45 PM IST
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync from Google Sheet (with verification)
        run: node server.js sync

      - name: Install WebP tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      # Uses the runner's preinstalled Google Chrome. Captures missing/blank
      # previews and converts every preview to a 1280×800 WebP.
      - name: Capture + normalise screenshots
        run: node cache-screenshots.js

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "folio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes since last run."
          else
            git commit -m "chore(data): daily archive sync + screenshots $(date -u +%Y-%m-%d)"
            git push
          fi
