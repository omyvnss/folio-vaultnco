name: update-archive

# Runs once a day. The Folio engine (engine/run.js) publishes one new site:
#   sheet queue (or AI discovery) → live check → screenshot → AI review → publish
# Every step has a deterministic code verifier; nothing ships unless all pass.
# AI = free OpenRouter models. Add the repo secret OPENROUTER_API_KEY to enable
# AI review/discovery; without it the engine falls back to heuristic checks.
#
# Note: GitHub queues scheduled runs, so the actual start is often 1–3 h late.

on:
  schedule:
    - cron: "15 18 * * *" # daily at 11:45 PM IST
  workflow_dispatch: {} # allow manual runs

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install WebP tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq webp

      - name: Verifier self-test
        run: node engine/test.js

      - name: Run engine (discover → verify → review → publish)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PER_DAY: ${{ vars.PER_DAY || '1' }}
        run: node engine/run.js

      # Uses the runner's preinstalled Google Chrome. Captures missing/blank
      # previews and converts every preview to a 1280×800 WebP.
      - name: Capture + normalise screenshots
        run: node cache-screenshots.js

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "folio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes since last run."
          else
            git commit -m "chore(data): daily archive sync + screenshots $(date -u +%Y-%m-%d)"
            git push
          fi
