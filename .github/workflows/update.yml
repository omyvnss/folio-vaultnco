name: update-archive

# Runs daily at 17:00 Asia/Kolkata (11:30 UTC).
# Pulls the latest links from the Google Sheet via server.js sync,
# snapshots them into data/, and auto-commits so the live site
# always ships with fresh data.

on:
  schedule:
    - cron: "30 11 * * *" # 17:00 IST daily
  workflow_dispatch: {} # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-archive
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync from Google Sheet
        run: node server.js sync

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "mnmm-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes since last run."
          else
            git commit -m "chore(data): daily archive sync $(date -u +%Y-%m-%d)"
            git push
          fi
