<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Folio VaultnCo</title>
  <meta name="description" content="A carefully curated collection of minimal websites.">
  <meta name="theme-color" content="#18181b">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

  <style>
    /* ================================================================
       Design tokens — Folio VaultnCo
       ================================================================ */
    :root {
      --color-neutral-50:  #09090b;
      --color-neutral-100: #18181b;
      --color-neutral-200: #27272a;
      --color-neutral-300: #3f3f46;
      --color-neutral-400: #52525b;
      --color-neutral-500: #71717a;
      --color-neutral-600: #a1a1aa;
      --color-neutral-700: #d4d4d8;
      --color-neutral-800: #e4e4e7;
      --color-neutral-900: #f4f4f5;
      --color-neutral-950: #fafafa;

      --color-foreground:         var(--color-neutral-950);
      --color-foreground-subtle:  var(--color-neutral-600);
      --color-foreground-subtler: var(--color-neutral-500);

      --font-display: "Gloock", serif;
      --font-sans:    "Geist", ui-sans-serif, sans-serif;
      --font-mono:    "IBM Plex Mono", ui-monospace, monospace;

      --font-base-size: 1rem;
      --font-pos-ratio: 1.2;
      --font-neg-ratio: 1.125;
      --font-base: var(--font-base-size);
      --font-md:   calc(var(--font-base) * var(--font-pos-ratio));
      --font-sm:   calc(var(--font-base) / var(--font-neg-ratio));
      --font-xsm:  calc(var(--font-sm) / var(--font-neg-ratio));
      --font-2xsm: calc(var(--font-xsm) / var(--font-neg-ratio));
      --font-3xsm: calc(var(--font-2xsm) / var(--font-neg-ratio));
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font: inherit; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      font-size: var(--font-base);
      color: var(--color-foreground);
      background-color: var(--color-neutral-50);
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      color: var(--color-foreground);
      background-color: var(--color-neutral-300);
    }

    :focus-visible { outline: 1px solid var(--color-foreground); outline-offset: 3px; }

    /* ================================================================
       Pattern — decorative 40px grid fading out from top-left
       ================================================================ */
    .pattern {
      position: absolute;
      top: -1px;
      left: -1px;
      z-index: -1;
      width: 100%;
      height: 400px;
      background-color: var(--color-neutral-50);
      background-image:
        linear-gradient(var(--color-neutral-200) 1px, transparent 1px),
        linear-gradient(to right, var(--color-neutral-200) 1px, var(--color-neutral-50) 1px);
      background-size: 40px 40px;
      opacity: 0.6;
      -webkit-mask-image: radial-gradient(circle at top left, #000, transparent 400px);
      mask-image: radial-gradient(circle at top left, #000, transparent 400px);
    }

    /* ================================================================
       Container
       ================================================================ */
    .container {
      width: 90%;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ================================================================
       Hero — exact structure & spacing from the original
       ================================================================ */
    .hero { padding: 120px 0 60px; text-align: left; }
    .hero .logo-mark {
      display: block;
      margin: 0 auto 20px;
      opacity: 0.5;
    }
    .hero .brand-name {
      font-weight: 500;
      color: var(--color-foreground);
      margin-top: 0;
    }
    .hero .brand-subtitle {
      margin-top: 10px;
      font-size: var(--font-md);
      color: var(--color-foreground-subtle);
      font-weight: 400;
    }
    .hero .brand-motto {
      margin-top: 6px;
      font-size: var(--font-sm);
      color: var(--color-foreground-subtler);
    }
    .hero .counter {
      margin-top: 20px;
      font-size: var(--font-sm);
      color: var(--color-foreground-subtler);
    }
    .hero .counter span {
      font-family: var(--font-mono);
      color: var(--color-foreground-subtle);
    }

    /* Shiny text — exact gradient/animation values from _shinyText_ */
    .shiny-text {
      display: inline-block;
      color: #a1a1aaa4;
      background: linear-gradient(120deg, #fff0 40%, #ffffffe5, #fff0 60%);
      -webkit-background-clip: text;
      background-clip: text;
      background-size: 200% 100%;
      animation: shine 5s linear infinite;
    }
    @keyframes shine {
      0%   { background-position: 100%; }
      100% { background-position: -100%; }
    }

    /* Random button — roll-up hover, like the original _button_ */
    .random-button {
      position: relative;
      display: inline-flex;
      align-items: baseline;
      column-gap: 1px;
      margin-top: 8px;
      font-size: var(--font-sm);
      font-weight: 500;
      color: var(--color-foreground-subtle);
      background: var(--color-neutral-50);
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }
    .random-button:hover { color: var(--color-foreground); }
    .random-button:active { transform: scale(0.95); }
    .random-button div { height: 1rem; overflow: hidden; }
    .random-button div span { display: block; transition: 0.3s; }
    .random-button:hover div span { transform: translateY(-100%); }

    /* ================================================================
       Curation link — "More Curation →" with vaultnco.store favicon
       ================================================================ */
    .curation-link {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-family: var(--font-mono);
      font-size: var(--font-xsm);
      color: var(--color-foreground-subtle);
      text-decoration: none;
      transition: 0.2s;
    }
    .curation-link:hover { color: var(--color-foreground); }
    .curation-link:hover .arrow { transform: translateX(3px); }
    .curation-link .arrow {
      color: var(--color-foreground);
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .curation-link .favicon-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: var(--color-neutral-900);
      border: 1px solid var(--color-neutral-200);
      border-radius: 8px;
      flex-shrink: 0;
    }
    .curation-link .favicon-wrap img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20px;
      height: 20px;
    }

    /* ================================================================
       Websites grid — exact grid/gap/card CSS from the original
       ================================================================ */
    .websites {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 36px 32px;
    }
    .archive { padding-bottom: 40px; }

    .website { width: 100%; }

    .website .image {
      position: relative;
      display: block;
    }
    .website .image img {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      background-color: var(--color-neutral-100);
      border: 1px solid var(--color-neutral-200);
    }

    /* Hover overlay — blur veil + scaling uppercase name (original behavior) */
    .website .image p {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      font-size: var(--font-2xsm);
      font-weight: 500;
      color: var(--color-foreground);
      text-transform: uppercase;
      pointer-events: none;
      background-color: #090b0bb3;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border: 1px solid var(--color-neutral-200);
      opacity: 0;
      transition: 0.2s;
    }
    .website .image p span {
      display: block;
      max-width: 92%;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: 0.2s;
      transform: scale(0.5);
    }
    .website .image:hover p { opacity: 1; }
    .website .image:hover p span { transform: scale(1); }

    /* Details row under the image (original: right-aligned mono link) */
    .website .details {
      display: flex;
      column-gap: 8px;
      align-items: center;
      justify-content: flex-end;
      margin-top: 12px;
      font-size: var(--font-sm);
    }
    .website .details .link {
      font-family: var(--font-mono);
      font-size: var(--font-xsm);
      color: var(--color-foreground-subtle);
      text-decoration: none;
      transition: 0.2s;
    }
    .website .details .link:hover { color: var(--color-foreground); }

    /* ================================================================
       Footer — original structure
       ================================================================ */
    .footer { padding: 50px 0; }
    .footer .curator {
      font-size: var(--font-sm);
      color: var(--color-foreground-subtler);
    }
    .footer .curator a {
      font-weight: 500;
      color: var(--color-foreground-subtle);
      text-decoration: none;
    }
    .footer .curator a:hover { color: var(--color-foreground); }
    .footer .meta {
      float: right;
      font-family: var(--font-mono);
      font-size: var(--font-3xsm);
      color: var(--color-neutral-400);
    }
    .footer .meta:hover { color: var(--color-foreground-subtler); }

    /* ================================================================
       Overlays
       ================================================================ */
    #loading, #error {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: grid;
      place-items: center;
      background-color: var(--color-neutral-50);
      padding: 24px;
    }
    #loading[hidden], #error[hidden] { display: none; }
    #loading p {
      font-family: var(--font-mono);
      font-size: var(--font-sm);
      letter-spacing: 0.15em;
      color: var(--color-foreground-subtler);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: 0.35; } }
    #error pre {
      font-family: var(--font-mono);
      font-size: var(--font-sm);
      line-height: 1.7;
      color: var(--color-foreground);
      text-align: center;
      white-space: pre-wrap;
      max-width: 40rem;
    }

    @media (prefers-reduced-motion: reduce) {
      .shiny-text { animation: none; }
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
      html { scroll-behavior: auto; }
    }

    @media (max-width: 480px) {
      .hero { padding: 80px 0 48px; }
    }
  </style>
</head>

<body>

  <div class="pattern"></div>

  <!-- ============ PAGE ============ -->
  <main class="container">

    <!-- ============ HERO (original layout) ============ -->
    <section class="hero" id="hero">
      <!-- Minimal star logo mark -->
      <svg class="logo-mark" width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
        <g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 4v24M4 16h24M7 7l18 18M25 7l-18 18"></path>
        </g>
      </svg>
      <h1 class="brand-name">Folio VaultnCo</h1>
      <p class="brand-subtitle">Curated minimal websites</p>
      <p class="brand-motto"><span class="shiny-text">Because less, is more.</span></p>

      <!-- More Curation link with vaultnco.store favicon -->
      <a class="curation-link" href="https://vaultnco.store" target="_blank" rel="noreferrer">
        <span class="curation-link__text">More Curation</span>
        <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
        <span class="favicon-wrap">
          <img src="data/screenshots/vaultnco-favicon.png" alt="vaultnco.store" width="22" height="22">
        </span>
      </a>

      <p class="counter"><span id="counter">·····</span> websites collected.</p>
      <button class="random-button" id="random-btn" type="button">
        (<div><span>Random</span><span>Random</span></div>)
      </button>
    </section>

    <!-- ============ ARCHIVE GRID ============ -->
    <section class="archive" id="archive-section" hidden>
      <div class="websites" id="grid"></div>
    </section>

  </main>

  <!-- ============ FOOTER (original structure) ============ -->
  <footer class="footer">
    <div class="container">
      <p class="curator">Curated by <a href="https://github.com/omyvnss" target="_blank" rel="noreferrer">Om Yaduvanshi</a>.</p>
    </div>
  </footer>

  <!-- ============ OVERLAYS ============ -->
  <div id="loading" role="status" aria-live="polite">
    <p>LOADING…</p>
  </div>
  <div id="error" hidden role="alert">
    <pre></pre>
  </div>

  <!-- ============ APP ============ -->
  <script>
    (() => {
      'use strict';

      const API_SITES = 'api/sites';       // served by server.js (localhost backend)
      const DATA_JSON = 'data/sites.json'; // committed by the daily cron (static hosts)
      const SHEET_CSV = 'https://docs.google.com/spreadsheets/d/1XALmHbWxrLTg1hVp4tSzk_3p3vpWoDGXVjwgmSsjjcA/export?format=csv';
      const LOCAL_CSV = 'data/sites.csv';
      const NEW_WINDOW_DAYS = 7;

      const $ = (id) => document.getElementById(id);

      const normalizeURL = (raw) =>
        String(raw ?? '').trim().replace(/^https?:\/\//i, '').replace(/\/+$/, '');

      function parseDate(s) {
        s = String(s ?? '').trim();
        if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
        const d = new Date(s + 'T00:00:00Z');
        return isNaN(d.getTime()) ? null : d;
      }

      const screenshotSrc = (url) =>
        `data/screenshots/${url.replace(/[^a-z0-9.-]/gi, '_').replace(/\.{2,}/g, '.')}.webp`;

      // Minimal RFC-4180-ish CSV parser (quoted fields, escaped quotes, CRLF)
      function parseCSV(text) {
        const rows = [];
        let row = [], field = '', inQ = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (inQ) {
            if (c === '"') {
              if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false;
            } else field += c;
          } else if (c === '"') inQ = true;
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n' || c === '\r') {
            if (c === '\r' && text[i + 1] === '\n') i++;
            row.push(field); field = '';
            if (row.length > 1 || row[0].trim()) rows.push(row);
            row = [];
          } else field += c;
        }
        row.push(field);
        if (row.length > 1 || row[0].trim()) rows.push(row);
        return rows;
      }

      async function fetchText(url) {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        if (/^\s*<(?:!doctype|html)/i.test(text)) throw new Error('Got HTML instead of data');
        return text;
      }

      function toSites(list) {
        return list
          .map((s) => ({ url: normalizeURL(s?.url ?? s), date: parseDate(s?.date) }))
          .filter((s) => /^[a-z0-9-]+(\.[a-z0-9-]+)+/i.test(s.url))
          .map((s) => ({
            ...s,
            isNew: !!s.date && Date.now() - s.date.getTime() <= NEW_WINDOW_DAYS * 86400000,
          }));
      }

      async function loadSites() {
        // 1) backend API (server.js)  2) committed snapshot  3) live sheet  4) raw csv
        try {
          const json = JSON.parse(await fetchText(API_SITES));
          const sites = toSites(json.sites || []);
          if (sites.length) return sites;
        } catch (_) {}
        try {
          const json = JSON.parse(await fetchText(DATA_JSON));
          const sites = toSites(json.sites || []);
          if (sites.length) return sites;
        } catch (_) {}
        try {
          const rows = parseCSV(await fetchText(SHEET_CSV)).slice(1);
          const sites = toSites(rows.map(([u, d]) => ({ url: u, date: d })));
          if (sites.length) return sites;
        } catch (_) {}
        try {
          const rows = parseCSV(await fetchText(LOCAL_CSV)).slice(1);
          const sites = toSites(rows.map(([u, d]) => ({ url: u, date: d })));
          if (sites.length) return sites;
        } catch (_) {}
        throw new Error(
          'FAILED TO LOAD ARCHIVE\n\n' +
          'No data source was reachable.\n' +
          'Fix: run "node server.js" (it syncs on start),\n' +
          'or check that the Google Sheet is shared as "Anyone with the link".'
        );
      }

      /* ---------------- rendering (original card anatomy) ---------------- */

      function card(site) {
        const wrap = document.createElement('div');
        wrap.className = 'website';

        const imageLink = document.createElement('a');
        imageLink.className = 'image';
        imageLink.href = `https://${site.url}`;
        imageLink.target = '_blank';
        imageLink.rel = 'noreferrer';

        const img = document.createElement('img');
        img.alt = `Screenshot of ${site.url}`;
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = screenshotSrc(site.url);
        img.addEventListener('error', function handler() {
          img.removeEventListener('error', handler);
          img.src = `https://api.microlink.io/?url=https://${encodeURIComponent(site.url)}&screenshot=true&meta=false&embed=screenshot.url`;
        });

        const overlay = document.createElement('p');
        const overlaySpan = document.createElement('span');
        overlaySpan.textContent = site.url;
        overlay.appendChild(overlaySpan);

        imageLink.append(img, overlay);

        const details = document.createElement('div');
        details.className = 'details';

        const link = document.createElement('a');
        link.className = 'link';
        link.href = `https://${site.url}`;
        link.target = '_blank';
        link.rel = 'noreferrer';
        link.textContent = site.url;
        details.appendChild(link);

        wrap.append(imageLink, details);
        return wrap;
      }

      function render(sites) {
        if (!sites.length) throw new Error('The archive is empty.');

        const padded = String(sites.length).padStart(5, '0');
        $('counter').textContent = padded;

        $('archive-section').hidden = false;
        sites.forEach((s) => $('grid').appendChild(card(s)));

        $('random-btn').addEventListener('click', () => {
          const cards = $('grid').children;
          const el = cards[Math.floor(Math.random() * cards.length)];
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        });
      }

      function showError(message) {
        $('loading').hidden = true;
        document.querySelectorAll('.site-header, main section').forEach((el) => (el.hidden = true));
        const err = $('error');
        err.hidden = false;
        err.querySelector('pre').textContent = message;
      }

      (async () => {
        try {
          render(await loadSites());
        } catch (e) {
          showError(e.message);
          return;
        }
        $('loading').hidden = true;
      })();
    })();
  </script>
</body>
</html>
